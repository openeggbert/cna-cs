name: build

# Builds and tests the managed solution. This checkout does not include an ABI-matched native CNA
# library or redistributable Microsoft XNA reference assemblies, so native integration and the
# full strict comparison run in protected/dependency-provisioned jobs. The reference-independent
# CNA-leak invariant is enforced here on every push and pull request.

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CNA.sln

      - name: Build
        run: dotnet build CNA.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CNA.sln --no-build --configuration Release

      - name: Verify strict facade has no CNA signature leaks
        run: >-
          dotnet run --project tools/api-compat --configuration Release --no-build --
          --leak-only --target src/CNA.XnaCompat/bin/Release/net8.0/CNA.XnaCompat.dll
